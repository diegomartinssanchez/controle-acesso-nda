{% extends "base.html" %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">Editar Colaborador</div>
      <form class="card-body" method="POST" action="/colaboradores/editar/{{ c.id }}">
        <div class="mb-2"><label class="form-label">Nome</label><input type="text" name="nome" value="{{ c.nome }}" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Matrícula</label><input type="text" name="matricula" value="{{ c.matricula }}" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Tag RFID</label><input type="text" name="tag_rfid" value="{{ c.tag_rfid }}" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Cargo</label><input type="text" name="cargo" value="{{ c.cargo }}" class="form-control" required></div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="tem_acesso" value="1" id="checkAcesso" {{ 'checked' if c.tem_acesso else '' }}>
          <label class="form-check-label" for="checkAcesso">Permissão de Acesso à Sala NDA</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" name="ativo" value="1" id="checkAtivo" {{ 'checked' if c.ativo else '' }}>
          <label class="form-check-label" for="checkAtivo">Colaborador Ativo</label>
        </div>
        <div class="d-flex justify-content-between">
          <a href="/colaboradores" class="btn btn-secondary">Voltar</a>
          <button type="submit" class="btn btn-primary">Atualizar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
