<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Acesso NDA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <a class="navbar-brand" href="/monitoramento">Estúdio NDA - Central de Segurança</a>
    {% if session.get('autenticado') %}
      <div>
        <a class="btn btn-outline-info btn-sm me-2" href="/monitoramento">Monitoramento</a>
        <a class="btn btn-outline-light btn-sm me-2" href="/colaboradores">Colaboradores</a>
        <a class="btn btn-outline-success btn-sm me-2" href="/api/eventos/exportar">Exportar CSV</a>
        <a class="btn btn-outline-danger btn-sm" href="/logout">Sair</a>
      </div>
    {% endif %}
  </nav>
  <div class="container-fluid px-4">
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
